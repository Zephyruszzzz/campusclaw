<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CampusClaw{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
/* ==========================================================================
   设计令牌：对齐 CampusClaw 智能教学平台演示站的视觉系统
   ========================================================================== */
:root{
  --brand:#94070a;        --brand-600:#7d0608;  --brand-500:#a3282b;
  --brand-100:#f7e6e6;    --brand-050:#fdf4f4;
  --accent:#b8860b;
  --bg:#f5f6f8;           --surface:#ffffff;   --surface-2:#fafbfc;
  --border:#e6e8ec;       --border-strong:#d3d7de;
  --text:#1c2530;         --text-2:#55606e;    --text-3:#8a94a2;
  --ok:#1f9d55;           --ok-bg:#e7f6ed;
  --warn:#b7791f;         --warn-bg:#fbf3e0;
  --danger:#c0392b;       --danger-bg:#fbeceb;
  --info:#2b6cb0;         --info-bg:#e8f1fa;
  --radius:12px;          --radius-sm:8px;     --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --sidebar-w:232px;      --topbar-h:60px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}

/* ---------------------------------------------------------------- 基础 */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{margin:0}
button,input,select{font-family:inherit}
button{cursor:pointer}
table{border-collapse:collapse}

/* ---------------------------------------------------------------- 布局 */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w); background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0; z-index:10;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--border)}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-500));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.3px}
.brand-sub{font-size:12px;color:var(--text-3)}
.nav-role{
  font-size:11px;letter-spacing:1px;color:var(--text-3);
  padding:16px 18px 8px;text-transform:uppercase;font-weight:700;
}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-sm);color:var(--text-2);font-weight:600;
  font-size:14px;transition:background .14s,color .14s;
}
.nav-item:hover{background:var(--brand-050);color:var(--brand)}
.nav-item-active{background:var(--brand-100);color:var(--brand)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-item.off{opacity:.42;pointer-events:none}
.sidebar-foot{margin-top:auto;padding:16px 18px}
.demo-tip{
  font-size:11px;color:var(--text-3);background:var(--surface-2);
  border:1px dashed var(--border-strong);border-radius:8px;
  padding:8px 10px;text-align:center;line-height:1.6;
}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{
  height:var(--topbar-h);background:#ffffffd9;border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 24px;position:sticky;top:0;z-index:9;
}
.topbar-class{display:flex;align-items:center;gap:8px;font-weight:700}
.topbar-class .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.topbar-right{display:flex;align-items:center;gap:14px}
.who{font-size:13px;color:var(--text-3)}
.who strong{color:var(--text)}
.logout{border:none;background:transparent;color:var(--text-3);font-size:13px;font-weight:600;padding:4px 0}
.logout:hover{color:var(--danger)}
.content{flex:1;min-width:0;padding:24px}
.page-head{margin-bottom:18px}
.page-title{font-size:20px;font-weight:800;letter-spacing:.2px}
.page-sub{color:var(--text-2);font-size:13.5px;margin-top:4px}

/* ---------------------------------------------------------------- 卡片 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-title{font-size:15px;font-weight:700}
.card-body{padding:20px}
.stack>*+*{margin-top:14px}

/* ---------------------------------------------------------------- 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;padding:9px 16px;white-space:nowrap;
  background:var(--surface);color:var(--text);transition:all .15s ease;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--brand-600)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:not(:disabled):hover{filter:brightness(.94)}
.btn-outline{border-color:var(--border-strong);color:var(--text)}
.btn-outline:not(:disabled):hover{border-color:var(--brand-500);color:var(--brand)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:not(:disabled):hover{background:var(--brand-050);color:var(--brand)}
.btn-block{width:100%}
.linkbtn{background:none;border:none;color:var(--brand);font-size:12.5px;font-weight:600;padding:0}
.linkbtn.danger{color:var(--danger)}
.linkbtn:hover{text-decoration:underline}

/* ---------------------------------------------------------------- 表单 */
.field>span{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.input{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);font-size:14px;background:var(--surface);
  color:var(--text);transition:border-color .14s,box-shadow .14s;
}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-050)}
.input::placeholder{color:var(--text-3)}

/* ------------------------------------------------------------ 徽章/标签 */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.7}
.badge-brand{background:var(--brand-100);color:var(--brand)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:#eef0f3;color:var(--text-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:12px}

/* ------------------------------------------------------------ 表格/列表 */
.table{width:100%;font-size:13.5px}
.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.table th{color:var(--text-3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--surface-2)}
.table tr:last-child td{border-bottom:none}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);flex-wrap:wrap;
}
.list-row+.list-row{margin-top:10px}
.list-row .grow{flex:1 1 240px;min-width:0}
.row-title{font-weight:700;overflow-wrap:anywhere}
.row-meta{color:var(--text-3);font-size:12.5px;margin-top:4px}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
pre.doc-body{
  white-space:pre-wrap;word-break:break-word;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px;margin:12px 0 0;
  font-size:13.5px;max-height:340px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
}
.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty-ic{font-size:34px;display:block;margin-bottom:10px}
.msg{font-size:13px;margin:10px 0 0}
.msg-err{color:var(--danger)}
.msg-ok{color:var(--ok)}

/* -------------------------------------------------------------- 上传区 */
.uploader{border:1.5px dashed var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);transition:all .14s}
.uploader:hover{border-color:var(--brand-500);background:var(--brand-050)}
.uploader.busy{opacity:.7;pointer-events:none}
.uploader-inner{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.uploader-ic{font-size:26px}
.uploader-hint{font-size:12.5px;color:var(--text-3);margin:8px 0 0}
input[type=file].input{padding:8px 10px;font-size:13px}

/* ---------------------------------------------------------------- 登录 */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.login-hero{
  background:linear-gradient(150deg,var(--brand) 0%,var(--brand-600) 60%,#5c0406 100%);
  color:#fff;padding:72px 60px;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden;
}
.login-hero:after{
  content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
}
.login-badge{
  display:inline-block;align-self:flex-start;background:#ffffff29;
  border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;
  font-size:13px;font-weight:600;margin-bottom:26px;
}
.login-hero h1{font-size:42px;font-weight:900;letter-spacing:1px;line-height:1.2}
.login-sub{margin-top:18px;font-size:16px;line-height:1.8;color:#ffffffe6;max-width:440px}
.login-features{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.login-features span{
  background:#ffffff1a;border:1px solid rgba(255,255,255,.18);
  padding:10px 16px;border-radius:10px;font-size:14px;width:fit-content;
}
.login-panel{
  display:flex;flex-direction:column;justify-content:center;
  padding:60px 56px;background:var(--surface);overflow-y:auto;
}
.login-panel-title{font-size:22px;font-weight:800}
.login-hint{color:var(--text-2);margin-top:8px;font-size:14px}
.login-form{margin-top:24px}
.login-form .field+.field{margin-top:14px}
.account-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.account{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--surface);transition:all .16s;text-align:left;width:100%;
}
.account:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-2px)}
.account-avatar{
  font-size:22px;width:38px;height:38px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;background:var(--brand-050);border-radius:10px;
}
.account-info{display:flex;flex-direction:column;flex:1;min-width:0}
.account-name{font-weight:700;font-size:14px}
.account-meta{font-size:12.5px;color:var(--text-3)}
.account-go{color:var(--brand);font-weight:700;font-size:13px}
.divider{display:flex;align-items:center;text-align:center;color:var(--text-3);font-size:12px;gap:10px;margin:22px 0 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--border)}
.login-foot{margin-top:22px;font-size:12px;color:var(--text-3);text-align:center}

/* -------------------------------------------------------------- 响应式 */
@media (max-width:860px){
  .sidebar{width:64px}
  .brand-text,.nav-item span:not(.nav-icon),.nav-role,.demo-tip{display:none}
  .main{margin-left:64px}
  .content{padding:16px}
  .login{grid-template-columns:1fr}
  .login-hero{padding:44px 28px}
  .login-hero h1{font-size:30px}
  .login-panel{padding:36px 24px}
}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
