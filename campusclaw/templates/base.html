<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CampusClaw{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
/* ==========================================================================
   CampusClaw 自有视觉系统

   骨架：通栏顶栏导航 + 页首横幅 + 居中内容区（不使用固定侧边栏）
   识别：靛紫主色 + 青绿点缀，10px 圆角体系
   ========================================================================== */
:root{
  --brand:#4a3f8f;        --brand-700:#372e6d;  --brand-600:#41387c;
  --brand-500:#5f53a8;    --brand-200:#cfc9ea;  --brand-100:#e6e2f5;
  --brand-050:#f4f2fb;
  --accent:#0f7b7d;       --accent-100:#dcf0f0;
  --bg:#f4f5f9;           --surface:#ffffff;    --surface-2:#f8f9fc;
  --border:#e4e6ee;       --border-strong:#ced2df;
  --text:#1a1d29;         --text-2:#555b6e;     --text-3:#8b90a3;
  --ok:#177245;           --ok-bg:#e4f4ea;
  --warn:#9a6a12;         --warn-bg:#faf1dd;
  --danger:#b32d2d;       --danger-bg:#fbe9e9;
  --info:#2a5f9e;         --info-bg:#e7eff9;
  --radius:10px;          --radius-sm:7px;      --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(20,22,40,.06);
  --shadow:0 6px 20px rgba(20,22,40,.09);
  --shadow-lg:0 18px 44px rgba(20,22,40,.16);
  --appbar-h:62px;        --shell-w:1160px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}

/* ---------------------------------------------------------------- 基础 */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{margin:0}
button,input,select{font-family:inherit}
button{cursor:pointer}
table{border-collapse:collapse}

/* ------------------------------------------------------------ 顶栏骨架 */
.app{min-height:100vh;display:flex;flex-direction:column}
.appbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.appbar-inner{
  max-width:var(--shell-w); margin:0 auto; height:var(--appbar-h);
  padding:0 24px; display:flex; align-items:center; gap:26px;
}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand-500),var(--brand-700));
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text strong{font-size:15.5px;font-weight:800;letter-spacing:.2px;color:var(--text)}
.logo-text small{font-size:11.5px;color:var(--text-3)}

.tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto}
.tab{
  position:relative; padding:8px 14px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; color:var(--text-2); white-space:nowrap;
  transition:background .14s,color .14s;
}
.tab:hover{background:var(--brand-050);color:var(--brand)}
.tab-active{color:var(--brand);background:var(--brand-100)}
.tab-active:after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  border-radius:2px;background:var(--brand);
}
.tab-off{color:var(--text-3);opacity:.66;cursor:not-allowed}
.tab-off:hover{background:transparent;color:var(--text-3)}

.userbox{display:flex;align-items:center;gap:10px;flex-shrink:0}
.class-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  border:1px solid var(--border);border-radius:999px;
  font-size:12.5px;font-weight:700;color:var(--text-2);background:var(--surface-2);
}
.class-chip .dot{
  width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px var(--ok-bg);
}
.who{font-size:13px;color:var(--text-3)}
.who strong{color:var(--text)}
.logout{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);
  font-size:13px;font-weight:600;padding:5px 12px;border-radius:var(--radius-sm);
  transition:all .14s;
}
.logout:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}

/* -------------------------------------------------------------- 页首横幅 */
.banner{
  background:
    radial-gradient(760px 210px at 12% -40%,rgba(74,63,143,.16),transparent 72%),
    radial-gradient(560px 190px at 88% -30%,rgba(15,123,125,.15),transparent 72%),
    var(--surface);
  border-bottom:1px solid var(--border);
}
.banner-inner{
  max-width:var(--shell-w); margin:0 auto; padding:26px 24px 24px;
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:22px; flex-wrap:wrap;
}
.banner h1{font-size:23px;font-weight:800;letter-spacing:.2px}
.banner p{margin:6px 0 0;color:var(--text-2);font-size:13.5px}
.stat-strip{display:flex;gap:10px;flex-wrap:wrap}
.stat{
  min-width:96px;padding:9px 14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.stat b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.stat span{font-size:11.5px;color:var(--text-3);letter-spacing:.3px}

/* ---------------------------------------------------------------- 内容区 */
.shell{
  flex:1; width:100%; max-width:var(--shell-w); margin:0 auto;
  padding:24px; min-width:0;
}
.stack>*+*{margin-top:16px}

/* ---------------------------------------------------------------- 卡片 */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 20px;border-bottom:1px solid var(--border);
}
.card-title{font-size:15px;font-weight:700}
.card-body{padding:20px}
.card-note{padding:14px 20px;border-top:1px dashed var(--border);color:var(--text-3);font-size:12.5px}

/* ---------------------------------------------------------------- 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;padding:9px 16px;white-space:nowrap;
  background:var(--surface);color:var(--text);transition:all .15s ease;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--brand-600)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:not(:disabled):hover{filter:brightness(.94)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:not(:disabled):hover{filter:brightness(.94)}
.btn-outline{border-color:var(--border-strong);color:var(--text)}
.btn-outline:not(:disabled):hover{border-color:var(--brand-500);color:var(--brand);background:var(--brand-050)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:not(:disabled):hover{background:var(--brand-050);color:var(--brand)}
.btn-block{width:100%}

/* ---------------------------------------------------------------- 表单 */
.field>span{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.input{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);font-size:14px;background:var(--surface);
  color:var(--text);transition:border-color .14s,box-shadow .14s;
}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.input::placeholder{color:var(--text-3)}
input[type=file].input{padding:8px 10px;font-size:13px}

/* ------------------------------------------------------------ 徽章/标签 */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;
  border-radius:999px;font-size:12px;font-weight:600;line-height:1.7;
}
.badge-brand{background:var(--brand-100);color:var(--brand)}
.badge-accent{background:var(--accent-100);color:var(--accent)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:#eceef4;color:var(--text-2)}

/* ------------------------------------------------------------ 材料列表 */
.row-list{display:flex;flex-direction:column;gap:10px}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border:1px solid var(--border);
  border-left:3px solid var(--brand-200);
  border-radius:var(--radius-sm);background:var(--surface);flex-wrap:wrap;
  transition:border-color .14s,box-shadow .14s;
}
.list-row:hover{border-color:var(--brand-200);border-left-color:var(--brand);box-shadow:var(--shadow-sm)}
.list-row .grow{flex:1 1 240px;min-width:0}
.row-title{font-weight:700;overflow-wrap:anywhere}
.row-meta{color:var(--text-3);font-size:12.5px;margin-top:4px}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
pre.doc-body{
  white-space:pre-wrap;word-break:break-word;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px;margin:12px 0 0;
  font-size:13.5px;max-height:340px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
}
.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty-ic{font-size:34px;display:block;margin-bottom:10px}
.msg{font-size:13px;margin:10px 0 0}
.msg-err{color:var(--danger)}
.msg-ok{color:var(--ok)}

/* -------------------------------------------------------------- 上传区 */
.uploader{
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);transition:all .14s;
}
.uploader:hover{border-color:var(--brand-500);background:var(--brand-050)}
.uploader.busy{opacity:.7;pointer-events:none}
.uploader-inner{display:flex;align-items:flex-end;gap:12px;padding:14px 16px;flex-wrap:wrap}
.uploader-ic{font-size:26px;line-height:1.1;padding-bottom:6px}
.uploader-hint{font-size:12.5px;color:var(--text-3);margin:8px 0 0}
.readonly-bar{
  display:flex;align-items:center;gap:14px;padding:16px 20px;
  background:linear-gradient(90deg,var(--brand-050),var(--surface));
}

/* ---------------------------------------------------------------- 登录 */
.login-stage{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;
  background:
    radial-gradient(680px 380px at 18% 8%,rgba(95,83,168,.55),transparent 68%),
    radial-gradient(620px 400px at 84% 92%,rgba(15,123,125,.45),transparent 68%),
    linear-gradient(150deg,#241d4d 0%,#3a2f75 52%,#12233a 100%);
}
.login-card{
  width:100%;max-width:452px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:34px 34px 28px;
}
.login-head{display:flex;align-items:center;gap:12px}
.login-head .logo-mark{width:42px;height:42px;border-radius:11px;font-size:22px}
.login-head h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.login-head p{margin:2px 0 0;font-size:12.5px;color:var(--text-3)}
.login-lead{
  margin:18px 0 0;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--brand-050);border:1px solid var(--brand-100);
  color:var(--text-2);font-size:12.8px;line-height:1.7;
}
.login-form{margin-top:18px}
.login-form .field+.field{margin-top:14px}
.login-submit{margin-top:20px}
.divider{
  display:flex;align-items:center;text-align:center;color:var(--text-3);
  font-size:12px;gap:10px;margin:22px 0 12px;
}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--border)}
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.account{
  display:flex;align-items:center;gap:9px;padding:9px 11px;text-align:left;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);transition:all .14s;min-width:0;
}
.account:hover{border-color:var(--brand);background:var(--brand-050);transform:translateY(-1px)}
.account-avatar{
  font-size:17px;width:29px;height:29px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;background:var(--brand-100);border-radius:8px;
}
.account-info{display:flex;flex-direction:column;min-width:0}
.account-name{font-weight:700;font-size:12.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-meta{font-size:11px;color:var(--text-3)}
.login-foot{margin-top:18px;font-size:11.5px;color:var(--text-3);text-align:center}

/* -------------------------------------------------------------- 响应式 */
@media (max-width:900px){
  .appbar-inner{gap:14px;padding:0 16px}
  .logo-text small{display:none}
  .tab-off{display:none}
  .who{display:none}
  .shell{padding:16px}
  .banner-inner{padding:20px 16px}
}
@media (max-width:620px){
  .login-card{padding:26px 20px 22px}
  .account-grid{grid-template-columns:1fr}
  .login-stage{padding:20px 14px}
}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
